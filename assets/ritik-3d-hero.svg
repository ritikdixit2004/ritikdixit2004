    <path d="M551 162L601 140L653 160L603 184L551 162Z" fill="#0B324B" stroke="#83FFF0"/><path d="M564 166L601 149L640 164L603 182L564 166Z" fill="#C0FFF4" filter="url(#glow)"><animate attributeName="fill" values="#C0FFF4;#35EBD5;#C0FFF4" dur="2s" repeatCount="indefinite"/></path>
    <path d="M499 171L531 184M512 193L545 207M679 174L710 160M665 202L700 186" stroke="#F5F85A" stroke-width="4" stroke-linecap="round"/><circle cx="516" cy="183" r="5" fill="#F9F66B" filter="url(#glow)"><animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="686" cy="183" r="5" fill="#F9F66B" filter="url(#glow)"><animate attributeName="r" values="6;3;6" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
