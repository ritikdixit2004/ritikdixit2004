  <circle cx="80" cy="70" r="130" fill="#276BFF" fill-opacity=".13"/><circle cx="1087" cy="286" r="170" fill="#09E2BE" fill-opacity=".07"/>
  <g opacity=".75"><circle cx="1021" cy="56" r="3" fill="#70FEEB"><animate attributeName="opacity" values=".15;1;.15" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="1085" cy="83" r="2" fill="#70FEEB"><animate attributeName="opacity" values="1;.15;1" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="1131" cy="48" r="3" fill="#70FEEB"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle></g>
  <path d="M205 254L601 96L995 253L601 331L205 254Z" fill="#0A1C3F" stroke="#3A79AE" stroke-opacity=".75"/><g opacity=".52" stroke="#3BC9DB"><path d="M285 243L601 116L913 242M365 274L601 180L837 275M450 301L601 241L750 301M601 96V331M500 136V311M702 136V311M400 176V293M802 176V293"/></g>
