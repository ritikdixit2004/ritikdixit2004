<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ritik Dixit — animated 3D Robotics, IoT and Embedded Systems banner</title>
  <desc id="desc">A futuristic animated isometric circuit chip and robotic rover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#06162E"/><stop offset=".55" stop-color="#0B2243"/><stop offset="1" stop-color="#04151D"/></linearGradient>
    <linearGradient id="chip" x1="478" y1="132" x2="715" y2="272" gradientUnits="userSpaceOnUse"><stop stop-color="#35F0D9"/><stop offset="1" stop-color="#087E9A"/></linearGradient>
    <linearGradient id="rover" x1="724" y1="209" x2="904" y2="278" gradientUnits="userSpaceOnUse"><stop stop-color="#4B72E9"/><stop offset="1" stop-color="#172964"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#010814" flood-opacity=".7"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#45B5D9" stroke-opacity=".08"/></pattern>
  </defs>
