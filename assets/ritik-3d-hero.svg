  <g filter="url(#glow)" stroke="#73FFF0" stroke-width="3" stroke-linecap="round"><path d="M815 129C827 117 846 117 858 129" stroke-dasharray="70" stroke-dashoffset="70"><animate attributeName="stroke-dashoffset" values="70;0;0" dur="2.4s" repeatCount="indefinite"/></path><path d="M808 117C824 100 850 100 866 117" stroke-dasharray="95" stroke-dashoffset="95"><animate attributeName="stroke-dashoffset" values="95;95;0;0" dur="2.4s" repeatCount="indefinite"/></path><path d="M801 105C821 83 854 83 873 105" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" values="120;120;120;0;0" dur="2.4s" repeatCount="indefinite"/></path></g>
